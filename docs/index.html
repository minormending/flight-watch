<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flight-watch</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f3f0;
    --surface-1: #fcfcfb;
    --border:    #e2e1dc;
    --grid:      #ebeae6;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #7a7975;
    --series-1: #2a78d6;
    --good:     #0ca30c;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-0: #111110;
      --surface-1: #1a1a19;
      --border:    #33332f;
      --grid:      #2a2a27;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #8f8e85;
      --series-1: #3987e5;
      --good:     #0ca30c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #111110; --surface-1: #1a1a19; --border: #33332f; --grid: #2a2a27;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e85;
    --series-1: #3987e5; --good: #0ca30c;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 64px;
    background: var(--surface-0); color: var(--text-primary);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 19px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 24px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px; margin-bottom: 16px;
  }
  .card h2 {
    font-size: 13px; font-weight: 600; margin: 0 0 2px;
    color: var(--text-primary); letter-spacing: -0.005em;
  }
  .card p.note { font-size: 12px; color: var(--text-muted); margin: 0 0 16px; }

  .hero { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; }
  .hero .fig {
    font-size: 52px; line-height: 1; font-weight: 620; letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .hero .meta { color: var(--text-secondary); font-size: 13px; padding-bottom: 5px; }
  .hero .meta strong { color: var(--text-primary); font-weight: 600; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
    font-weight: 600; padding: 3px 9px; border-radius: 999px;
    border: 1px solid currentColor;
  }
  .chip.good { color: var(--good); }
  .chip.hold { color: var(--text-muted); }
  a.book {
    display: inline-block; margin-top: 14px; font-size: 13px; font-weight: 600;
    color: var(--series-1); text-decoration: none;
  }
  a.book:hover { text-decoration: underline; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px;
          background: var(--border); border: 1px solid var(--border); border-radius: 10px;
          overflow: hidden; margin-bottom: 16px; }
  .kpi { background: var(--surface-1); padding: 14px 16px; }
  .kpi .k { font-size: 11px; color: var(--text-muted); text-transform: uppercase;
            letter-spacing: 0.045em; font-weight: 600; }
  .kpi .v { font-size: 22px; font-weight: 600; margin-top: 3px;
            font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary);
            margin-bottom: 10px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .dash { width: 14px; height: 0; border-top: 2px dashed var(--text-muted); display: inline-block; }

  .plot { overflow-x: auto; }
  svg { display: block; }
  .tick { fill: var(--text-muted); font-size: 10px; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--border); stroke-width: 1; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.045em;
       color: var(--text-muted); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  details { margin-top: 14px; }
  summary { cursor: pointer; font-size: 12px; color: var(--text-secondary); }
  .tablewrap { max-height: 340px; overflow-y: auto; margin-top: 10px; }

  #tip {
    position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 7px;
    padding: 8px 10px; font-size: 12px; line-height: 1.45; z-index: 20;
    box-shadow: 0 4px 14px rgba(0,0,0,.13); white-space: nowrap; color: var(--text-primary);
  }
  #tip b { font-variant-numeric: tabular-nums; }
  .empty { color: var(--text-secondary); font-size: 13px; }
  .empty code { background: var(--surface-0); padding: 1px 5px; border-radius: 4px;
                border: 1px solid var(--border); font-size: 12px; }
  footer { color: var(--text-muted); font-size: 12px; margin-top: 26px; }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">Loading…</p></div>
<div id="tip"></div>

<script>
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = (n) => n == null ? '—' : '$' + Number(n).toLocaleString('en-US');
const tip = document.getElementById('tip');

function showTip(evt, html) {
  tip.innerHTML = html;
  tip.style.opacity = 1;
  const pad = 14, r = tip.getBoundingClientRect();
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + r.width > innerWidth - 8) x = evt.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = evt.clientY - r.height - pad;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => { tip.style.opacity = 0; };

function niceTicks(lo, hi, count = 5) {
  const span = hi - lo || 1;
  const raw = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(Math.round(v));
  return out;
}

const shortDate = (iso) => {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-US',
    { month: 'short', day: 'numeric', timeZone: 'UTC' });
};

/* ---- Column chart: cheapest trip by departure date ---------------------- */
function departureChart(rows, threshold) {
  const W = Math.max(920, rows.length * 6), H = 260;
  const m = { t: 12, r: 14, b: 26, l: 46 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;

  const prices = rows.map(r => r.price);
  const hi = Math.max(...prices, threshold ?? 0);
  const ticks = niceTicks(0, hi);
  const top = ticks[ticks.length - 1];
  const y = v => m.t + ih - (v / top) * ih;
  const bw = iw / rows.length;
  const barW = Math.max(1.5, bw - 2); // 2px surface gap between bars

  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
    aria-label="Cheapest round trip by departure date">`;
  for (const t of ticks) {
    s += `<line class="gridline" x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/>`;
    s += `<text class="tick" x="${m.l - 8}" y="${y(t) + 3.5}" text-anchor="end">${money(t)}</text>`;
  }
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i], cheap = threshold != null && r.price <= threshold;
    const h = Math.max(1, m.t + ih - y(r.price));
    const x = m.l + i * bw + (bw - barW) / 2;
    s += `<rect x="${x.toFixed(2)}" y="${y(r.price).toFixed(2)}" width="${barW.toFixed(2)}"
      height="${h.toFixed(2)}" rx="${Math.min(2, barW / 2).toFixed(2)}"
      fill="${cheap ? 'var(--good)' : 'var(--series-1)'}"/>`;
  }
  if (threshold != null) {
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(threshold)}" y2="${y(threshold)}"
      stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="5 4"/>`;
  }
  // Monthly x labels.
  let lastMonth = '';
  for (let i = 0; i < rows.length; i++) {
    const mo = rows[i].depart.slice(0, 7);
    if (mo !== lastMonth) {
      lastMonth = mo;
      const [yy, mm] = mo.split('-').map(Number);
      const label = new Date(Date.UTC(yy, mm - 1, 1))
        .toLocaleDateString('en-US', { month: 'short', timeZone: 'UTC' });
      s += `<text class="tick" x="${(m.l + i * bw).toFixed(1)}" y="${H - 8}">${label}</text>`;
    }
  }
  s += `<line class="axis" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}"/>`;
  // Full-height hover targets, wider than the bars themselves.
  for (let i = 0; i < rows.length; i++) {
    s += `<rect x="${(m.l + i * bw).toFixed(2)}" y="${m.t}" width="${Math.max(bw, 4).toFixed(2)}"
      height="${ih}" fill="transparent" data-i="${i}"/>`;
  }
  return s + '</svg>';
}

/* ---- Line chart: cheapest price observed per day ------------------------ */
function historyChart(hist, threshold) {
  const W = 920, H = 220, m = { t: 12, r: 14, b: 26, l: 46 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const vals = hist.map(d => d.low);
  const lo = Math.min(...vals), hi = Math.max(...vals, threshold ?? 0);
  const ticks = niceTicks(Math.max(0, lo - (hi - lo) * 0.2), hi);
  const top = ticks[ticks.length - 1], bot = Math.min(ticks[0], lo);
  const y = v => m.t + ih - ((v - bot) / (top - bot || 1)) * ih;
  const x = i => hist.length === 1 ? m.l + iw / 2 : m.l + (i / (hist.length - 1)) * iw;

  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="height:auto"
    role="img" aria-label="Cheapest price observed per day">`;
  for (const t of ticks) {
    s += `<line class="gridline" x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/>`;
    s += `<text class="tick" x="${m.l - 8}" y="${y(t) + 3.5}" text-anchor="end">${money(t)}</text>`;
  }
  if (threshold != null) {
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(threshold)}" y2="${y(threshold)}"
      stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="5 4"/>`;
  }
  const d = hist.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.low).toFixed(1)}`).join(' ');
  s += `<path d="${d}" fill="none" stroke="var(--series-1)" stroke-width="2"
    stroke-linejoin="round" stroke-linecap="round"/>`;
  if (hist.length <= 40) {
    hist.forEach((p, i) => {
      s += `<circle cx="${x(i).toFixed(1)}" cy="${y(p.low).toFixed(1)}" r="4"
        fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2"/>`;
    });
  }
  const step = Math.max(1, Math.ceil(hist.length / 7));
  hist.forEach((p, i) => {
    if (i % step === 0) {
      s += `<text class="tick" x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${shortDate(p.day)}</text>`;
    }
  });
  s += `<line class="axis" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}"/>`;
  s += `<line id="cross" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}"
    stroke="var(--text-muted)" stroke-width="1" opacity="0"/>`;
  s += `<rect id="hitzone" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
  return { svg: s + '</svg>', x, W, m, iw };
}

/* ---- Render ------------------------------------------------------------- */
function render(d) {
  const app = document.getElementById('app');
  const { route, summary, by_date, history, alerts } = d;
  const best = summary.best_now;
  const isCheap = best && summary.threshold != null && best.price <= summary.threshold;

  const head = `<h1>${esc(route.origin)} &rarr; ${esc(route.destination)},
    ${route.stay_nights} nights</h1>
    <div class="sub">Flexible dates &middot; alerts at the
    ${route.percentile}th percentile of the last ${route.baseline_days} days
    &middot; last scan ${summary.last_scan ? esc(summary.last_scan.replace('T', ' ').slice(0, 16)) + ' UTC' : 'never'}</div>`;

  if (!by_date.length) {
    app.innerHTML = head + `<div class="card"><h2>No data yet</h2>
      <p class="note">Run a scan to populate this dashboard.</p>
      <p class="empty">Try <code>flight-watch scan --limit 5 --export docs</code> first,
      then the full sweep.</p></div>`;
    return;
  }

  const hero = `<div class="card"><div class="hero">
      <div>
        <div class="k" style="font-size:11px;color:var(--text-muted);text-transform:uppercase;
          letter-spacing:.045em;font-weight:600;margin-bottom:6px">Cheapest right now</div>
        <div class="fig">${money(best.price)}</div>
      </div>
      <div class="meta">
        <div>Out <strong>${esc(best.depart)}</strong> &middot; back <strong>${esc(best.ret)}</strong></div>
        <div>${esc(best.airlines || 'unknown airline')}${best.stops === 0 ? ' &middot; nonstop' :
          best.stops ? ` &middot; ${best.stops} stop${best.stops > 1 ? 's' : ''}` : ''}</div>
        <div style="margin-top:8px"><span class="chip ${isCheap ? 'good' : 'hold'}">
          ${isCheap ? '&#9679; alert-worthy' : '&#9675; above threshold'}</span></div>
      </div>
    </div>
    ${summary.booking_url ? `<a class="book" href="${esc(summary.booking_url)}"
      target="_blank" rel="noopener">Open in Google Flights &rarr;</a>` : ''}
    </div>`;

  const kpis = `<div class="kpis">
    <div class="kpi"><div class="k">All-time low</div><div class="v">${money(summary.all_time_low)}</div></div>
    <div class="kpi"><div class="k">Typical (p50)</div><div class="v">${money(summary.median)}</div></div>
    <div class="kpi"><div class="k">Alert threshold</div><div class="v">${money(summary.threshold)}</div></div>
    <div class="kpi"><div class="k">Observations</div><div class="v">${summary.observations.toLocaleString()}</div></div>
    <div class="kpi"><div class="k">History</div><div class="v">${summary.span_days.toFixed(1)}d</div></div>
  </div>`;

  const rowsHtml = by_date.map(r => `<tr><td>${esc(r.depart)}</td><td>${esc(r.ret)}</td>
    <td class="num">${money(r.price)}</td><td>${esc(r.airlines)}</td></tr>`).join('');

  const depCard = `<div class="card">
    <h2>Cheapest round trip by departure date</h2>
    <p class="note">Most recent price seen for each departure date, ${route.stay_nights}-night stay.</p>
    <div class="legend">
      <span><i class="swatch" style="background:var(--good)"></i> at or below alert threshold</span>
      <span><i class="swatch" style="background:var(--series-1)"></i> above threshold</span>
      ${summary.threshold != null ? `<span><i class="dash"></i> alert threshold (${money(summary.threshold)})</span>` : ''}
    </div>
    <div class="plot" id="depplot">${departureChart(by_date, summary.threshold)}</div>
    <details><summary>View as table (${by_date.length} dates)</summary>
      <div class="tablewrap"><table><thead><tr><th>Depart</th><th>Return</th>
      <th class="num">Price</th><th>Airline</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>
    </details></div>`;

  let histCard = '';
  if (history.length > 1) {
    const h = historyChart(history, summary.threshold);
    histCard = `<div class="card"><h2>Cheapest price seen per day</h2>
      <p class="note">The lowest ${route.stay_nights}-night fare anywhere in the window, by scan day.</p>
      ${summary.threshold != null ? `<div class="legend"><span><i class="dash"></i>
        alert threshold (${money(summary.threshold)})</span></div>` : ''}
      <div class="plot" id="histplot">${h.svg}</div></div>`;
    window.__hist = { ...h, data: history };
  }

  const alertsCard = alerts.length ? `<div class="card"><h2>Alerts fired</h2>
    <table><thead><tr><th>When (UTC)</th><th>Depart</th><th class="num">Price</th>
    <th class="num">Threshold</th><th>Sent via</th></tr></thead><tbody>
    ${alerts.map(a => `<tr><td>${esc(a.fired_at.replace('T', ' ').slice(0, 16))}</td>
      <td>${esc(a.depart_date)}</td><td class="num">${money(a.price)}</td>
      <td class="num">${money(a.threshold)}</td><td>${esc(a.channels || '—')}</td></tr>`).join('')}
    </tbody></table></div>` : '';

  app.innerHTML = head + hero + kpis + depCard + histCard + alertsCard +
    `<footer>Prices are what Google Flights showed at scan time and can vanish before you book.
     Southwest never appears in Google Flights &mdash; check it separately.</footer>`;

  // Hover: departure bars.
  const dep = document.querySelector('#depplot svg');
  if (dep) {
    dep.addEventListener('mousemove', e => {
      const t = e.target.closest('rect[data-i]');
      if (!t) return hideTip();
      const r = by_date[+t.dataset.i];
      const cheap = summary.threshold != null && r.price <= summary.threshold;
      showTip(e, `<b>${money(r.price)}</b> &nbsp;${cheap ? '<span style="color:var(--good)">below threshold</span>' : ''}
        <br>Out ${esc(r.depart)} &middot; back ${esc(r.ret)}
        <br>${esc(r.airlines || 'unknown')}`);
    });
    dep.addEventListener('mouseleave', hideTip);
  }

  // Hover: history crosshair.
  const hp = document.querySelector('#histplot svg');
  if (hp && window.__hist) {
    const { x, W, data } = window.__hist;
    const cross = hp.querySelector('#cross');
    hp.addEventListener('mousemove', e => {
      const box = hp.getBoundingClientRect();
      const px = ((e.clientX - box.left) / box.width) * W;
      let bi = 0, bd = Infinity;
      data.forEach((_, i) => { const dd = Math.abs(x(i) - px); if (dd < bd) { bd = dd; bi = i; } });
      const p = data[bi];
      cross.setAttribute('x1', x(bi)); cross.setAttribute('x2', x(bi));
      cross.setAttribute('opacity', '1');
      showTip(e, `<b>${money(p.low)}</b> cheapest<br>${esc(p.day)}
        <br><span style="color:var(--text-secondary)">avg ${money(Math.round(p.mean))} · ${p.n} dates</span>`);
    });
    hp.addEventListener('mouseleave', () => { cross.setAttribute('opacity', '0'); hideTip(); });
  }
}

fetch('data.json', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
  .then(render)
  .catch(err => {
    document.getElementById('app').innerHTML =
      `<h1>flight-watch</h1><div class="card"><h2>No data yet</h2>
       <p class="empty">Could not load <code>data.json</code> (${esc(err.message)}).
       Generate it with <code>flight-watch export --out docs</code>.</p></div>`;
  });
</script>
</body>
</html>
