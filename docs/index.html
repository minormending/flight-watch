<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flight-watch</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f3f0;
    --surface-1: #fcfcfb;
    --border:    #e2e1dc;
    --grid:      #ebeae6;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #7a7975;
    --series-1: #2a78d6;
    --good:     #0ca30c;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-0: #111110;
      --surface-1: #1a1a19;
      --border:    #33332f;
      --grid:      #2a2a27;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #8f8e85;
      --series-1: #3987e5;
      --good:     #0ca30c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #111110; --surface-1: #1a1a19; --border: #33332f; --grid: #2a2a27;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e85;
    --series-1: #3987e5; --good: #0ca30c;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 64px;
    background: var(--surface-0); color: var(--text-primary);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 19px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 24px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px; margin-bottom: 16px;
  }
  .card h2 {
    font-size: 13px; font-weight: 600; margin: 0 0 2px;
    color: var(--text-primary); letter-spacing: -0.005em;
  }
  .card p.note { font-size: 12px; color: var(--text-muted); margin: 0 0 16px; }

  .hero { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; }
  .hero .fig {
    font-size: 52px; line-height: 1; font-weight: 620; letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .hero .meta { color: var(--text-secondary); font-size: 13px; padding-bottom: 5px; }
  .hero .meta strong { color: var(--text-primary); font-weight: 600; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
    font-weight: 600; padding: 3px 9px; border-radius: 999px;
    border: 1px solid currentColor;
  }
  .chip.good { color: var(--good); }
  .chip.hold { color: var(--text-muted); }
  a.book {
    display: inline-block; margin-top: 14px; font-size: 13px; font-weight: 600;
    color: var(--series-1); text-decoration: none;
  }
  a.book:hover { text-decoration: underline; }

  /* Real gaps rather than the gap-as-hairline trick: an unfilled row would
     otherwise paint leftover cells in the border colour. */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
          gap: 10px; margin-bottom: 16px; }
  .kpi { background: var(--surface-1); border: 1px solid var(--border);
         border-radius: 10px; padding: 14px 16px; }
  .kpi .k { font-size: 11px; color: var(--text-muted); text-transform: uppercase;
            letter-spacing: 0.045em; font-weight: 600; }
  .kpi .v { font-size: 22px; font-weight: 600; margin-top: 3px;
            font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary);
            margin-bottom: 10px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .dash { width: 14px; height: 0; border-top: 2px dashed var(--text-muted); display: inline-block; }

  .plot { overflow-x: auto; }
  svg { display: block; }
  .tick { fill: var(--text-muted); font-size: 10px; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--border); stroke-width: 1; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.045em;
       color: var(--text-muted); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  details { margin-top: 14px; }
  summary { cursor: pointer; font-size: 12px; color: var(--text-secondary); }
  .tablewrap { max-height: 340px; overflow-y: auto; margin-top: 10px; }

  #tip {
    position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 7px;
    padding: 8px 10px; font-size: 12px; line-height: 1.45; z-index: 20;
    box-shadow: 0 4px 14px rgba(0,0,0,.13); white-space: nowrap; color: var(--text-primary);
  }
  #tip b { font-variant-numeric: tabular-nums; }
  .card h3 { font-size: 12px; font-weight: 600; margin: 22px 0 8px;
             color: var(--text-secondary); text-transform: uppercase;
             letter-spacing: 0.045em; }
  .hero .k, .kpi .k { font-size: 11px; color: var(--text-muted);
             text-transform: uppercase; letter-spacing: .045em; font-weight: 600; }
  .hero .sublabel { font-size: 12px; color: var(--text-secondary); margin-top: 5px; }
  .proxy { font-size: 12px; color: var(--text-secondary); background: var(--surface-0);
           border: 1px solid var(--border); border-left: 3px solid var(--series-1);
           border-radius: 6px; padding: 9px 11px; margin: 14px 0 4px; }
  .empty { color: var(--text-secondary); font-size: 13px; }
  .empty code { background: var(--surface-0); padding: 1px 5px; border-radius: 4px;
                border: 1px solid var(--border); font-size: 12px; }
  footer { color: var(--text-muted); font-size: 12px; margin-top: 26px; }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">Loading…</p></div>
<div id="tip"></div>

<script>
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = (n) => n == null ? '—' : '$' + Number(n).toLocaleString('en-US');
const tip = document.getElementById('tip');

function showTip(evt, html) {
  tip.innerHTML = html;
  tip.style.opacity = 1;
  const pad = 14, r = tip.getBoundingClientRect();
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + r.width > innerWidth - 8) x = evt.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = evt.clientY - r.height - pad;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => { tip.style.opacity = 0; };

function niceTicks(lo, hi, count = 5) {
  const span = hi - lo || 1;
  const raw = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(Math.round(v));
  return out;
}

const shortDate = (iso) => {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-US',
    { month: 'short', day: 'numeric', timeZone: 'UTC' });
};

/* ---- Bar chart: one bar per row (a date, or a destination) -------------- */
function barChart(rows, id) {
  // Destination codes need room to sit under their own bar; a run of dates
  // reads better packed tight with month markers, the way a price calendar does.
  const perBar = id === 'destinations' ? 22 : 6;
  const W = Math.max(920, rows.length * perBar), H = 260;
  const m = { t: 12, r: 14, b: 46, l: 54 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const thresholds = rows.map(r => r.threshold).filter(v => v != null);
  const hi = Math.max(...rows.map(r => r.price), ...thresholds, 1);
  const ticks = niceTicks(0, hi);
  const top = ticks[ticks.length - 1];
  const y = v => m.t + ih - (v / top) * ih;
  const bw = iw / rows.length;
  // Cap the width so a chart with three bars does not render three slabs.
  const barW = Math.min(46, Math.max(1.5, bw - 2)); // 2px surface gap between bars

  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
    aria-label="Cheapest round trip by ${id}">`;
  for (const t of ticks) {
    s += `<line class="gridline" x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/>`;
    s += `<text class="tick" x="${m.l - 8}" y="${y(t) + 3.5}" text-anchor="end">${money(t)}</text>`;
  }
  rows.forEach((r, i) => {
    const cheap = !r.warming_up && r.threshold != null && r.price <= r.threshold;
    const h = Math.max(1, m.t + ih - y(r.price));
    const x = m.l + i * bw + (bw - barW) / 2;
    s += `<rect x="${x.toFixed(2)}" y="${y(r.price).toFixed(2)}" width="${barW.toFixed(2)}"
      height="${h.toFixed(2)}" rx="${Math.min(2, barW / 2).toFixed(2)}"
      fill="${cheap ? 'var(--good)' : 'var(--series-1)'}"/>`;
  });

  // One shared threshold (a single-destination watch) draws as a rule line;
  // per-destination thresholds differ per bar, so the bar colour carries it.
  const uniq = [...new Set(thresholds)];
  if (uniq.length === 1) {
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(uniq[0])}" y2="${y(uniq[0])}"
      stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="5 4"/>`;
  }

  if (bw >= 16) {
    rows.forEach((r, i) => {
      const cx = m.l + i * bw + bw / 2;
      s += `<text class="tick" x="${cx.toFixed(1)}" y="${H - 26}" text-anchor="end"
        transform="rotate(-45 ${cx.toFixed(1)} ${H - 26})">${esc(r.short)}</text>`;
    });
  } else {
    let last = '';
    rows.forEach((r, i) => {
      const key = (r.depart || '').slice(0, 7);
      if (key && key !== last) {
        last = key;
        const [yy, mm] = key.split('-').map(Number);
        const label = new Date(Date.UTC(yy, mm - 1, 1))
          .toLocaleDateString('en-US', { month: 'short', timeZone: 'UTC' });
        s += `<text class="tick" x="${(m.l + i * bw).toFixed(1)}" y="${H - 14}">${label}</text>`;
      }
    });
  }
  s += `<line class="axis" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}"/>`;
  rows.forEach((r, i) => {
    s += `<rect x="${(m.l + i * bw).toFixed(2)}" y="${m.t}" width="${Math.max(bw, 4).toFixed(2)}"
      height="${ih}" fill="transparent" data-i="${i}"/>`;
  });
  return s + '</svg>';
}

/* ---- Line chart: cheapest price observed per day ------------------------ */
function historyChart(hist) {
  const W = 920, H = 200, m = { t: 12, r: 14, b: 26, l: 54 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const vals = hist.map(d => d.low);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const ticks = niceTicks(Math.max(0, lo - (hi - lo) * 0.2), hi);
  const top = ticks[ticks.length - 1], bot = Math.min(ticks[0], lo);
  const y = v => m.t + ih - ((v - bot) / (top - bot || 1)) * ih;
  const x = i => hist.length === 1 ? m.l + iw / 2 : m.l + (i / (hist.length - 1)) * iw;

  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="height:auto"
    role="img" aria-label="Cheapest price observed per day">`;
  for (const t of ticks) {
    s += `<line class="gridline" x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/>`;
    s += `<text class="tick" x="${m.l - 8}" y="${y(t) + 3.5}" text-anchor="end">${money(t)}</text>`;
  }
  const d = hist.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.low).toFixed(1)}`).join(' ');
  s += `<path d="${d}" fill="none" stroke="var(--series-1)" stroke-width="2"
    stroke-linejoin="round" stroke-linecap="round"/>`;
  if (hist.length <= 40) {
    hist.forEach((p, i) => {
      s += `<circle cx="${x(i).toFixed(1)}" cy="${y(p.low).toFixed(1)}" r="4"
        fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2"/>`;
    });
  }
  const step = Math.max(1, Math.ceil(hist.length / 7));
  hist.forEach((p, i) => {
    if (i % step === 0) {
      s += `<text class="tick" x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${shortDate(p.day)}</text>`;
    }
  });
  s += `<line class="axis" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}"/>`;
  s += `<rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
  return { svg: s + '</svg>', x, W };
}

const CHART_CAP = 45;

function watchCard(block, index) {
  const { route: r, summary: sm, rows, history, alerts, kind } = block;
  const best = sm.best;
  const perPerson = (p) => r.party_size > 1
    ? ` &middot; ~${money(Math.round(p / r.party_size))} pp` : '';

  if (!rows.length) {
    return `<div class="card"><h2>${esc(block.name)}</h2>
      <p class="note">${esc(r.origin)} &rarr; ${esc(r.scope)} &middot; ${esc(r.stay_label)}</p>
      <p class="empty">No observations yet.</p></div>`;
  }

  const chartRows = (kind === 'destinations' ? rows.slice(0, CHART_CAP) : rows)
    .map(x => ({ ...x, short: kind === 'destinations' ? x.destination : shortDate(x.depart) }));

  const capNote = kind === 'destinations' && rows.length > CHART_CAP
    ? ` (${CHART_CAP} cheapest of ${rows.length})` : '';

  const proxy = r.proxy_label
    ? `<div class="proxy">Scanned as ${esc(r.proxy_label)} &mdash; Google withholds prices
       for ${esc(r.party_label)} on most routes. Alerts re-price your real party;
       figures here are within about 1%.</div>` : '';

  const hist = history.length > 1 ? historyChart(history) : null;
  if (hist) window.__hist[index] = { ...hist, data: history };

  return `<div class="card">
    <h2>${esc(block.name)}</h2>
    <p class="note">${esc(r.origin)} &rarr; ${esc(r.scope)} &middot; ${esc(r.stay_label)}
      &middot; ${esc(r.stops_label)} &middot; ${esc(r.window)}<br>
      ${esc(r.party_label)} &middot; ${esc(r.cabin)} &middot; ${r.carry_on_bags} carry-on each</p>
    ${proxy}
    <div class="hero">
      <div>
        <div class="k">Cheapest right now</div>
        <div class="fig">${money(best.price)}</div>
        <div class="sublabel">${esc(best.destination)} &middot; ${esc(best.depart)} &rarr; ${esc(best.ret)}${perPerson(best.price)}</div>
      </div>
      <div class="meta">
        <div>${esc(best.airlines || 'unknown airline')}${best.stops === 0 ? ' &middot; nonstop' :
          best.stops ? ` &middot; ${best.stops} stop${best.stops > 1 ? 's' : ''}` : ''}</div>
        <div style="margin-top:8px"><span class="chip ${sm.warming_up ? 'hold' : (best.price <= best.threshold ? 'good' : 'hold')}">
          ${sm.warming_up
            ? `&#9675; warming up (${sm.observations}/${sm.warmup_target} obs, ${sm.span_days.toFixed(1)}/${sm.warmup_days}d)`
            : (best.price <= best.threshold ? '&#9679; alert-worthy' : '&#9675; above threshold')}</span></div>
        ${best.booking_url ? `<a class="book" href="${esc(best.booking_url)}" target="_blank" rel="noopener">Open in Google Flights &rarr;</a>` : ''}
      </div>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="k">All-time low</div><div class="v">${money(sm.all_time_low)}</div></div>
      <div class="kpi"><div class="k">Typical (p50)</div><div class="v">${money(sm.median)}</div></div>
      <div class="kpi"><div class="k">Observations</div><div class="v">${sm.observations.toLocaleString()}</div></div>
      <div class="kpi"><div class="k">History</div><div class="v">${sm.span_days.toFixed(1)}d</div></div>
    </div>

    <h3>Cheapest by ${kind === 'destinations' ? 'destination' : 'departure date'}${capNote}</h3>
    <div class="legend">
      ${sm.warming_up
        ? '<span>Thresholds are still warming up, so nothing is marked alert-worthy yet.</span>'
        : `<span><i class="swatch" style="background:var(--good)"></i> at or below its alert threshold</span>
           <span><i class="swatch" style="background:var(--series-1)"></i> above threshold</span>`}
    </div>
    <div class="plot" data-chart="${index}">${barChart(chartRows, kind)}</div>

    ${hist ? `<h3>Cheapest seen per day</h3>
      <div class="plot" data-hist="${index}">${hist.svg}</div>` : ''}

    <details><summary>View as table (${rows.length})</summary>
      <div class="tablewrap"><table><thead><tr><th>${kind === 'destinations' ? 'Dest' : 'Depart'}</th>
      <th>Dates</th><th class="num">Price</th><th class="num">Threshold</th><th>Airline</th></tr></thead>
      <tbody>${rows.map(x => `<tr><td>${esc(x.destination)}</td>
        <td>${esc(x.depart)} → ${esc(x.ret)}</td><td class="num">${money(x.price)}</td>
        <td class="num">${money(x.threshold)}</td><td>${esc(x.airlines)}</td></tr>`).join('')}
      </tbody></table></div></details>

    ${alerts.length ? `<h3>Alerts fired</h3><table><thead><tr><th>When (UTC)</th>
      <th>Depart</th><th class="num">Price</th><th>Sent via</th></tr></thead><tbody>
      ${alerts.map(a => `<tr><td>${esc(a.fired_at.replace('T',' ').slice(0,16))}</td>
        <td>${esc(a.depart_date)}</td><td class="num">${money(a.price)}</td>
        <td>${esc(a.channels || '—')}</td></tr>`).join('')}</tbody></table>` : ''}
    </div>`;
}

function render(d) {
  const app = document.getElementById('app');
  window.__hist = {};
  window.__rows = {};

  if (!d.watches || !d.watches.length) {
    app.innerHTML = `<h1>flight-watch</h1><div class="card"><h2>No data yet</h2>
      <p class="empty">Run <code>flight-watch scan --export docs</code>.</p></div>`;
    return;
  }

  const cards = d.watches.map((b, i) => {
    window.__rows[i] = (b.kind === 'destinations' ? b.rows.slice(0, CHART_CAP) : b.rows);
    return watchCard(b, i);
  }).join('');

  app.innerHTML = `<h1>flight-watch</h1>
    <div class="sub">${d.watches.length} watch${d.watches.length > 1 ? 'es' : ''}
      &middot; generated ${esc((d.generated_at || '').replace('T', ' ').slice(0, 16))} UTC</div>
    ${cards}
    <footer>Prices are what Google Flights showed at scan time and can vanish before you book.
     Southwest never appears in Google Flights.</footer>`;

  document.querySelectorAll('[data-chart]').forEach(node => {
    const idx = node.dataset.chart, rows = window.__rows[idx];
    const svg = node.querySelector('svg');
    svg.addEventListener('mousemove', e => {
      const t = e.target.closest('rect[data-i]');
      if (!t) return hideTip();
      const r = rows[+t.dataset.i];
      const cheap = !r.warming_up && r.threshold != null && r.price <= r.threshold;
      showTip(e, `<b>${money(r.price)}</b>${!r.warming_up && cheap ? ' <span style="color:var(--good)">below threshold</span>' : ''}
        <br>${esc(r.destination)} &middot; ${esc(r.depart)} → ${esc(r.ret)}
        <br>${esc(r.airlines || 'unknown')}${r.threshold != null ? `<br><span style="color:var(--text-secondary)">threshold ${money(r.threshold)}</span>` : ''}`);
    });
    svg.addEventListener('mouseleave', hideTip);
  });

  document.querySelectorAll('[data-hist]').forEach(node => {
    const h = window.__hist[node.dataset.hist];
    if (!h) return;
    const svg = node.querySelector('svg');
    svg.addEventListener('mousemove', e => {
      const box = svg.getBoundingClientRect();
      const px = ((e.clientX - box.left) / box.width) * h.W;
      let bi = 0, bd = Infinity;
      h.data.forEach((_, i) => { const dd = Math.abs(h.x(i) - px); if (dd < bd) { bd = dd; bi = i; } });
      const p = h.data[bi];
      showTip(e, `<b>${money(p.low)}</b> cheapest<br>${esc(p.day)}
        <br><span style="color:var(--text-secondary)">avg ${money(Math.round(p.mean))} · ${p.n} prices</span>`);
    });
    svg.addEventListener('mouseleave', hideTip);
  });
}

fetch('data.json', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
  .then(render)
  .catch(err => {
    document.getElementById('app').innerHTML =
      `<h1>flight-watch</h1><div class="card"><h2>No data yet</h2>
       <p class="empty">Could not load <code>data.json</code> (${esc(err.message)}).
       Generate it with <code>flight-watch export --out docs</code>.</p></div>`;
  });
</script>
</body>
</html>
